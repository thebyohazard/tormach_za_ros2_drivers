---
# This config file is used by ros2_control.
# The /** wildcard allows parameters to apply under any namespace (including
# namespaced deployments like /nutting_station/arm), while still working at
# the root namespace for non-namespaced deployments.
/**:
  controller_manager:
    ros__parameters:
      # update_rate used in mock_hardware config only
      update_rate: 100  # Hz

      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      streaming_controller:
        type: position_controllers/JointGroupPositionController

  joint_trajectory_controller:
    ros__parameters:
      joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      command_interfaces:
      - position
      - velocity
      state_interfaces:
      - position
      - velocity
        # Adding this causes control_node to throw exception, even
        # though it's defined in the ros2_control URDF
        # - effort
      # Silence warning:
      #
      # [joint_trajectory_controller]: [Deprecated]:
      # "allow_nonzero_velocity_at_trajectory_end" is set to true. The
      # default behavior will change to false. (on_init() at
      # ./src/joint_trajectory_controller.cpp:67)
      allow_nonzero_velocity_at_trajectory_end: false

      # Trajectory tracking + goal tolerances. Without these, JTC reports
      # SUCCESSFUL as soon as the trajectory time elapses regardless of
      # whether the arm physically tracked the path (e.g. drives disabled
      # silently report success because state never reaches the goal but
      # nothing checks). `trajectory` aborts mid-execution if any joint
      # falls outside tolerance during the path; `goal` is checked at
      # trajectory end.
      constraints:
        goal_time: 0.5                   # seconds of slack past trajectory end
        stopped_velocity_tolerance: 0.01  # radians per second
        joint_1: { trajectory: 0.05, goal: 0.01 }  # radians
        joint_2: { trajectory: 0.05, goal: 0.01 }  # radians
        joint_3: { trajectory: 0.05, goal: 0.01 }  # radians
        joint_4: { trajectory: 0.05, goal: 0.01 }  # radians
        joint_5: { trajectory: 0.05, goal: 0.01 }  # radians
        joint_6: { trajectory: 0.05, goal: 0.01 }  # radians

  streaming_controller:
    ros__parameters:
      joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      command_interfaces:
      - position
      state_interfaces:
      - position

  joint_state_broadcaster:
    ros__parameters:
      joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
